<article class="article-bloc">
    <span class="dot"></span>
    <div class="article-bloc-head">
        <p class="institution">{{certificateInstitution}}</p>
        <div class="period">{{certificateYear}}</div>
    </div>
    <ul class="article-bloc-bullets">
        <li>{{certificateTitle}}</li>
        <li>{{certificateDescription}}</li>
    </ul>
</article>
