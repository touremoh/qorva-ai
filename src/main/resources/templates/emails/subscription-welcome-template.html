<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qorva AI – Subscription Confirmation</title>
    <style>
        body { margin: 0; padding: 0; background-color: #EEF2F7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
        table { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
        img { border: 0; display: block; }
        .email-wrapper { width: 100%; background-color: #EEF2F7; padding: 40px 0; }
        .email-container { max-width: 600px; margin: 0 auto; background: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .email-header { background-color: #0A1628; padding: 28px 40px; text-align: center; }
        .email-header img { max-height: 42px; max-width: 160px; margin: 0 auto; }
        .email-content { padding: 40px 44px; }
        .greeting { font-size: 22px; font-weight: 700; color: #0A1628; margin: 0 0 16px; line-height: 1.3; }
        .email-content p { font-size: 15px; color: #4A5568; line-height: 1.65; margin: 0 0 20px; }
        .plan-card { width: 100%; border: 1px solid #E2E8F0; border-radius: 10px; overflow: hidden; margin: 28px 0; }
        .plan-card-header { background-color: #0A1628; padding: 10px 20px; }
        .plan-card-header td { color: #72BB53; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; }
        .plan-card-body td { padding: 13px 20px; font-size: 14px; background-color: #F8FAFC; }
        .plan-card-body tr + tr td { border-top: 1px solid #E2E8F0; }
        .plan-label { color: #718096; width: 45%; }
        .plan-value { color: #0A1628; font-weight: 600; }
        .plan-value-green { color: #52A837; font-weight: 700; }
        .features-title { font-size: 14px; font-weight: 600; color: #2D3748; margin: 28px 0 12px; }
        .features-list { padding: 0; margin: 0 0 28px; list-style: none; }
        .features-list li { font-size: 14px; color: #4A5568; padding: 7px 0 7px 30px; position: relative; border-bottom: 1px solid #F0F4F8; line-height: 1.5; }
        .features-list li:last-child { border-bottom: none; }
        .features-list li::before { content: "✓"; color: #72BB53; font-weight: 700; font-size: 13px; position: absolute; left: 6px; top: 8px; }
        .btn-wrapper { text-align: center; margin: 32px 0 28px; }
        .btn { display: inline-block; padding: 14px 44px; background-color: #72BB53; color: #FFFFFF; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 15px; letter-spacing: 0.3px; }
        .support-line { font-size: 13px; color: #A0AEC0; text-align: center; margin: 0; }
        .support-line a { color: #52A837; text-decoration: none; }
        .email-footer { background-color: #F8FAFC; border-top: 1px solid #E8EDF3; padding: 22px 40px; text-align: center; }
        .email-footer p { font-size: 12px; color: #A0AEC0; margin: 0; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="email-wrapper">
        {{template_content}}
    </div>
</body>
</html>
