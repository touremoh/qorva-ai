<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You've been added to Qorva AI</title>
    <style>
        body { margin: 0; padding: 0; background-color: #EEF2F7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
        table { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
        img { border: 0; display: block; }
        .email-wrapper { width: 100%; background-color: #EEF2F7; padding: 40px 0; }
        .email-container { max-width: 600px; margin: 0 auto; background: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .email-content { padding: 40px 44px; }
        .greeting { font-size: 22px; font-weight: 700; color: #0A1628; margin: 0 0 16px; line-height: 1.3; }
        .email-content p { font-size: 15px; color: #4A5568; line-height: 1.65; margin: 0 0 20px; }
        .credentials-card { width: 100%; border: 1px solid #E2E8F0; border-radius: 10px; overflow: hidden; margin: 28px 0; }
        .credentials-card-body td { padding: 13px 20px; font-size: 14px; background-color: #F8FAFC; }
        .credentials-card-body tr + tr td { border-top: 1px solid #E2E8F0; }
        .cred-label { color: #718096; width: 45%; }
        .cred-value { color: #0A1628; font-weight: 600; }
        .cred-password { font-family: 'Courier New', Courier, monospace; font-size: 13px; letter-spacing: 1.5px; color: #0A1628; font-weight: 700; background-color: #F0F9EC; }
        .warning-notice { background-color: #FFFBEB; border-left: 4px solid #F59E0B; border-radius: 6px; padding: 14px 18px; margin: 24px 0; }
        .warning-notice p { font-size: 13px; color: #92400E; margin: 0; line-height: 1.7; }
        .support-line { font-size: 13px; color: #A0AEC0; text-align: center; margin: 0; }
        .support-line a { color: #52A837; text-decoration: none; }
        .email-footer { background-color: #F8FAFC; border-top: 1px solid #E8EDF3; padding: 22px 40px; text-align: center; }
        .email-footer p { font-size: 12px; color: #A0AEC0; margin: 0; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="email-wrapper">
        {{template_content}}
    </div>
</body>
</html>
