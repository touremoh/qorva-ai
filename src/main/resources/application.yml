server:
  servlet:
    context-path: /
  tomcat:
    # Tomcat >= 10.1.42 defaults maxPartCount to 50; sync uploads send one part per
    # file (cap 50) and bulk staging chunks are <= 50 files, so 60 leaves headroom.
    max-part-count: 60


management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false


spring:
  application:
    name: qorva-ai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 500MB
  messages:
    basename: messages/errors
    encoding: UTF-8
    use-code-as-default-message: true
  ai:
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
      on-client-errors: false

mongock:
  migration-scan-package: ai.qorva.core.migrations

qorva:
  ai:
    extraction:
      # Text pass runs on every CV; switch to a nano-tier model after benchmarking —
      # the vision pass below catches what a smaller model fumbles.
      model: ${QORVA_EXTRACTION_MODEL:gpt-4.1-mini}
      # Vision pass runs only on escalated CVs (thin text / missing contact / low confidence).
      vision-model: ${QORVA_EXTRACTION_VISION_MODEL:gpt-4.1-mini}
    job-description:
      model: ${QORVA_JOB_DESCRIPTION_MODEL:gpt-5-mini}
  products:
    starter:
      stripe-product-name: Starter
      features:
        seats: 2
        limits:
          screening-actions: 2000
          ai-resume-chats: 500
          talent-intelligence-queries: 1000
          email-templates: 3
          bulk-upload-files: 100
          ats-connections: 1
        overage:
          enabled: false
          screening-action-price: 0.0
          chat-price: 0.0
          intelligence-query-price: 0.0
    pro:
      stripe-product-name: Pro
      features:
        seats: 5
        limits:
          screening-actions: 10000
          ai-resume-chats: 1500
          talent-intelligence-queries: 3000
          email-templates: 15
          bulk-upload-files: 300
          ats-connections: 3
        overage:
          enabled: true
          screening-action-price: 0.02
          chat-price: 0.10
          intelligence-query-price: 0.50
    scale:
      stripe-product-name: Scale
      features:
        seats: 15
        limits:
          screening-actions: 25000
          ai-resume-chats: 4000
          talent-intelligence-queries: 8000
          email-templates: 50
          bulk-upload-files: 1000
          ats-connections: 7
        overage:
          enabled: true
          screening-action-price: 0.02
          chat-price: 0.10
          intelligence-query-price: 0.50


  # ATS integrations. The credentials key has a dev-only default; tst/prd override it
  # from the environment (see application-tst.yml / application-prd.yml).
  ats:
    credentials-key: ${ATS_CREDENTIALS_ENCRYPTION_KEY:local-dev-only-ats-credentials-key}
    public-base-url: ${ATS_PUBLIC_BASE_URL:http://localhost:8080}
    sync-interval-minutes: ${ATS_SYNC_INTERVAL_MINUTES:30}
    initial-sync-guard: ${ATS_INITIAL_SYNC_GUARD:500}
    # Harvest API version — bump without a rebuild if Greenhouse moves the base path.
    # OAuth connections use the first; customer-generated API keys use the second.
    greenhouse-harvest-base-url: ${GREENHOUSE_HARVEST_BASE_URL:https://harvest.greenhouse.io/v3}
    greenhouse-harvest-api-key-base-url: ${GREENHOUSE_HARVEST_API_KEY_BASE_URL:https://harvest.greenhouse.io/v1}
    oauth:
      greenhouse:
        client-id: ${GREENHOUSE_CLIENT_ID:}
        client-secret: ${GREENHOUSE_CLIENT_SECRET:}
        # Must match the redirect URI and scopes approved on the Greenhouse app registration.
        redirect-uri: ${GREENHOUSE_REDIRECT_URI:}
        scopes: ${GREENHOUSE_SCOPES:}
      zoho_recruit:
        client-id: ${ATS_ZOHO_CLIENT_ID:}
        client-secret: ${ATS_ZOHO_CLIENT_SECRET:}
        # Override only if the URI registered in the Zoho API console differs from
        # ${ATS_PUBLIC_BASE_URL}/integrations/zoho_recruit/oauth/callback — Zoho matches it exactly.
        redirect-uri: ${ATS_ZOHO_REDIRECT_URI:}
        scopes: ${ATS_ZOHO_SCOPES:}
      lever:
        client-id: ${ATS_LEVER_CLIENT_ID:}
        client-secret: ${ATS_LEVER_CLIENT_SECRET:}
        redirect-uri: ${ATS_LEVER_REDIRECT_URI:}
        scopes: ${ATS_LEVER_SCOPES:}
