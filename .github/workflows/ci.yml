name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23
          cache: maven
      # Unit tests plus the integration suite (Testcontainers MongoDB — Docker is available on ubuntu-latest).
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/site/jacoco
            target/contract-actual
          if-no-files-found: ignore
